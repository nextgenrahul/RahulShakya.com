version: "3.9"

networks:
  rahul-network:
    driver: bridge

volumes:
  postgres-data:
  pgadmin-data:

services:
  # ─────────────────────────────────────────────
  # PostgreSQL
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: rahulshakya-postgres
    restart: unless-stopped

    env_file:
      - ./backend/.env

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - rahul-network

  # ─────────────────────────────────────────────
  # PgAdmin
  # ─────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: rahulshakya-pgadmin
    restart: unless-stopped

    env_file:
      - ./backend/.env

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}

    ports:
      - "5051:80"

    volumes:
      - pgadmin-data:/var/lib/pgadmin

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - rahul-network

  # ─────────────────────────────────────────────
  # FastAPI
  # ─────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: rahulshakya-api
    restart: unless-stopped

    env_file:
      - ./backend/.env

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/app

    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - rahul-network

  # ─────────────────────────────────────────────
  # Next.js
  # ─────────────────────────────────────────────
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: rahulshakya-web
    restart: unless-stopped

    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000

    ports:
      - "3000:3000"

    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

    depends_on:
      - api

    networks:
      - rahul-network